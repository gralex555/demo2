file:
  allowed-extension: pdf,docs,txt,jpg
spring:
  kafka:
    bootstrap-service: localhost:9092

  datasource:
    url: jdbc:postgresql://localhost:5432/gralex
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8082
